[tool.black]
line-length = 100
target-version = ["py311"]
exclude = '''
/(
  \.git
  | \.venv
  | venv
  | __pycache__
  | \.pytest_cache
  | \.mypy_cache
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".git", ".venv", "venv", "__pycache__", ".pytest_cache", ".mypy_cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []
