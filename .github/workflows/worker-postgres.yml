name: Worker PostgreSQL

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  postgres:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: worker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d worker_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Verify PostgreSQL upserts and rollback
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://test_user:test_password@localhost:5432/worker_test
        run: python -m pytest tests/test_candle_ingestion_postgres.py tests/test_formation_history_postgres.py tests/test_forward_tracking_postgres.py tests/test_forward_reports_postgres.py tests/test_account_postgres.py tests/test_portfolio_postgres.py -q -ra
