<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crypto Trend · Giriş</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6f9;color:#142438;font:16px system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}main{width:min(100%,420px);background:white;border:1px solid #dfe6ec;border-radius:18px;padding:32px;box-shadow:0 12px 40px #1424380b}h1{margin:0 0 12px;font-size:28px}p{color:#627386;line-height:1.6}form,label{display:grid;gap:10px}form{gap:20px}input,button{font:inherit;padding:12px;border-radius:8px;border:1px solid #b9c8d4;width:100%}button{background:#087b70;color:white;border-color:#087b70;cursor:pointer}button:disabled{opacity:.6}input:focus-visible,button:focus-visible{outline:3px solid #5298ff;outline-offset:2px}#status{min-height:26px;color:#a14638}
main{border-top:5px solid #0f766e}h1{color:#0f766e}label{font-weight:600;color:#334155}
</style></head><body><main><h1>Crypto Trend</h1><p>Analizlerine ve kişisel takip alanına erişmek için giriş yap.</p><form id="login-form"><label>Kullanıcı adı<input id="username" autocomplete="username" maxlength="32" required autofocus></label><label>Parola<input id="password" type="password" autocomplete="current-password" maxlength="128" required></label><button id="submit" type="submit">Giriş yap</button></form><p id="status" role="status" aria-live="polite"></p><small>Hesaplar yönetici tarafından oluşturulur.</small></main><script>
function destination(){const value=new URLSearchParams(location.search).get("next");if(value){try{const url=new URL(value,location.origin);if(url.origin===location.origin&&["/analysis/binance/dashboard","/analysis/binance/chart"].includes(url.pathname))return url.pathname+url.search}catch{}}return "/analysis/binance/dashboard?tab=overview"}
document.getElementById("login-form").onsubmit=async e=>{e.preventDefault();const button=document.getElementById("submit"),status=document.getElementById("status");button.disabled=true;status.textContent="Giriş yapılıyor…";try{const response=await fetch("/account/login",{method:"POST",credentials:"same-origin",cache:"no-store",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:document.getElementById("username").value.trim().toLowerCase(),password:document.getElementById("password").value})});if(!response.ok){let message="Giriş tamamlanamadı; yeniden dene.";try{const data=await response.json();if(typeof data.detail==="string")message=data.detail}catch{}throw Error(message)}document.getElementById("password").value="";location.replace(destination())}catch(error){status.textContent=error.message;button.disabled=false}};
</script></body></html>
