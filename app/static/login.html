<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crypto Trend · Giriş</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6f9;color:#142438;font:16px system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}main{width:min(100%,420px);background:white;border:1px solid #dfe6ec;border-radius:18px;padding:32px;box-shadow:0 12px 40px #1424380b}h1{margin:0 0 12px;font-size:28px}p{color:#627386;line-height:1.6}form,label{display:grid;gap:10px}form{gap:20px}input,button{font:inherit;padding:12px;border-radius:8px;border:1px solid #b9c8d4;width:100%}button{background:#087b70;color:white;border-color:#087b70;cursor:pointer}button:disabled{opacity:.6}input:focus-visible,button:focus-visible{outline:3px solid #5298ff;outline-offset:2px}#status{min-height:26px;color:#a14638}
main{border-top:5px solid #0f766e}h1{color:#0f766e}label{font-weight:600;color:#334155}

:root{--surface:#fff;--page:#f7f9fc;--ink:#1d2c42;--muted:#56687e;--line:#dce4ee}
:root[data-theme="dark"]{--surface:#1b2432;--page:#101722;--ink:#e7edf7;--muted:#b2bfd2;--line:#3a485d}
body{background:var(--page);color:var(--ink)}main,section{background:var(--surface);border-color:var(--line)}p,small,dt{color:var(--muted)}input,select{background:var(--surface);color:var(--ink);border-color:var(--line)}h1,h2,h3{color:#1e40af}:root[data-theme="dark"] h1,:root[data-theme="dark"] h2,:root[data-theme="dark"] h3{color:#8ab4ff}
.theme-toggle{background:var(--surface);color:var(--ink);border:1px solid var(--line);font-size:13px;padding:8px 12px;cursor:pointer;width:auto;margin-bottom:12px}
:root[data-theme="dark"] #status{background:#253143;color:#b2bfd2}:root[data-theme="dark"] #status[data-error=true]{background:#3d321f;color:#f0c374}:root[data-theme="dark"] svg text{fill:#b2bfd2}

dialog.app-help{background:var(--surface,#fff);color:var(--ink,#142438);border:1px solid var(--line,#dce5ed);border-radius:14px;width:min(680px,calc(100vw - 28px));max-height:85vh;padding:22px;overflow:auto}dialog.app-help::backdrop{background:rgba(10,20,35,.55)}.help-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.app-help p{line-height:1.65}.help-button{padding:8px 12px}.direction-checks{min-width:280px;max-width:520px;white-space:normal}
</style></head><body><main><button id="page-help" type="button" class="secondary help-button" aria-haspopup="dialog">? Yardım</button><button id="theme-toggle" type="button" class="theme-toggle" aria-pressed="false">Koyu tema</button><h1>Crypto Trend</h1><p>Analizlerine ve kişisel takip alanına erişmek için giriş yap.</p><form id="login-form"><label>Kullanıcı adı<input id="username" autocomplete="username" maxlength="32" required autofocus></label><label>Parola<input id="password" type="password" autocomplete="current-password" maxlength="128" required></label><button id="submit" type="submit">Giriş yap</button></form><p id="status" role="status" aria-live="polite"></p><small>Hesaplar yönetici tarafından oluşturulur.</small></main><dialog id="page-help-dialog" class="app-help" aria-labelledby="page-help-title"><div class="help-head"><h2 id="page-help-title">Yardım</h2><button id="page-help-close" type="button" class="secondary">Kapat</button></div><div id="page-help-body"></div></dialog><script>

function applyDisplayTheme(theme,persist=false){const dark=theme==="dark";document.documentElement.dataset.theme=dark?"dark":"light";document.documentElement.style.colorScheme=dark?"dark":"light";const b=document.getElementById("theme-toggle");if(b){b.textContent=dark?"Beyaz tema":"Koyu tema";b.setAttribute("aria-pressed",String(dark))}if(persist){try{localStorage.setItem("crypto-trend-theme",dark?"dark":"light")}catch{}}}
let initialDisplayTheme="light";try{initialDisplayTheme=localStorage.getItem("crypto-trend-theme")||"light"}catch{}applyDisplayTheme(initialDisplayTheme);
const themeButton=document.getElementById("theme-toggle");if(themeButton)themeButton.onclick=()=>applyDisplayTheme(document.documentElement.dataset.theme==="dark"?"light":"dark",true);
window.addEventListener("storage",e=>{if(e.key==="crypto-trend-theme")applyDisplayTheme(e.newValue||"light")});

function destination(){const value=new URLSearchParams(location.search).get("next");if(value){try{const url=new URL(value,location.origin);if(url.origin===location.origin&&["/analysis/binance/dashboard","/analysis/binance/chart"].includes(url.pathname))return url.pathname+url.search}catch{}}return "/analysis/binance/dashboard?tab=overview"}
document.getElementById("login-form").onsubmit=async e=>{e.preventDefault();const button=document.getElementById("submit"),status=document.getElementById("status");button.disabled=true;status.textContent="Giriş yapılıyor…";try{const response=await fetch("/account/login",{method:"POST",credentials:"same-origin",cache:"no-store",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:document.getElementById("username").value.trim().toLowerCase(),password:document.getElementById("password").value})});if(!response.ok){let message="Giriş tamamlanamadı; yeniden dene.";try{const data=await response.json();if(typeof data.detail==="string")message=data.detail}catch{}throw Error(message)}document.getElementById("password").value="";location.replace(destination())}catch(error){status.textContent=error.message;button.disabled=false}};

const pageHelpTexts={"page": ["Giriş", "Yönetici tarafından oluşturulan kullanıcı adı ve parolayla giriş yap. Yeni üyelik başvurusu bu ekranda yoktur.", "Oturum açılınca uygulamaya erişilir. Parolanı unuttuysan yöneticiyle iletişime geç. Çıkış düğmesi uygulamanın üst panelindedir."]};
let pageHelpReturn=null;
function openPageHelp(){const dialog=document.getElementById("page-help-dialog"),body=document.getElementById("page-help-body");let key="page";

const lines=pageHelpTexts[key]||pageHelpTexts.coin;document.getElementById("page-help-title").textContent=lines[0];body.replaceChildren();for(const line of lines.slice(1)){const p=document.createElement("p");p.textContent=line;body.append(p)}

pageHelpReturn=document.activeElement;dialog.showModal();document.getElementById("page-help-close").focus()}
document.getElementById("page-help").onclick=openPageHelp;
document.getElementById("page-help-close").onclick=()=>document.getElementById("page-help-dialog").close();
document.getElementById("page-help-dialog").addEventListener("close",()=>pageHelpReturn?.focus());
document.getElementById("page-help-dialog").addEventListener("click",event=>{if(event.target===event.currentTarget){const r=event.currentTarget.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)event.currentTarget.close()}});
</script></body></html>
